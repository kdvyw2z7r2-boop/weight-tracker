<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="h1" cx="22%" cy="12%" r="75%"><stop offset="0" stop-color="#8a3a14"/><stop offset="1" stop-color="#8a3a14" stop-opacity="0"/></radialGradient>
    <radialGradient id="h2" cx="95%" cy="55%" r="65%"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#ff7a45" stop-opacity="0"/></radialGradient>
    <radialGradient id="h3" cx="25%" cy="100%" r="70%"><stop offset="0" stop-color="#4a1d0c"/><stop offset="1" stop-color="#4a1d0c" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity=".30"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc09a"/><stop offset="1" stop-color="#ff7a45"/></linearGradient>
    <linearGradient id="trend" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe2cf"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0c0907"/>
  <rect width="512" height="512" fill="url(#h1)"/>
  <rect width="512" height="512" fill="url(#h2)"/>
  <rect width="512" height="512" fill="url(#h3)"/>
  <!-- disque de verre -->
  <circle cx="256" cy="256" r="168" fill="url(#glass)"/>
  <circle cx="256" cy="256" r="167" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <ellipse cx="256" cy="168" rx="120" ry="58" fill="#fff" opacity=".10"/>
  <!-- anneau de progression -->
  <circle cx="256" cy="256" r="126" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="22"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="url(#arc)" stroke-width="22" stroke-linecap="round" stroke-dasharray="560 792" transform="rotate(-90 256 256)"/>
  <!-- courbe descendante -->
  <path d="M176 214 L226 250 L262 236 L330 302" fill="none" stroke="url(#trend)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="330" cy="302" r="17" fill="#34c759"/>
